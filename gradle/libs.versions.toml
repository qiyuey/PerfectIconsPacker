[versions]
# Build
agp = "9.6.0-alpha02"
kotlin = "2.5.0-Beta2"

# AndroidX
activityCompose = "1.14.0-alpha03"
coreKtx = "1.19.1"
lifecycle = "2.12.0-alpha05"

# Compose
compose = "1.13.0-rc01"

# Miuix
miuix = "0.9.4"

# Data
coroutines = "1.11.0"

# Root
libsu = "6.0.0"

# Git
jgit = "7.8.1.202611041320-r"

[libraries]
junit = { module = "junit:junit", version = "4.13.2" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version = "2.1.0-alpha1" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }

miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference-android", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons-android", version.ref = "miuix" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur-android", version.ref = "miuix" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }

jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
